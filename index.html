<style>
  :root {
    --bg1: #eef1f4;
    --bg2: #d3d9df;
    --top: #d3d9df;
    --panel: #ffffff;
    --line: #cfd6dc;
    --ink: #141a20;
    --muted: #5d6a76;
    --floor-a: #dfe3e7;
    --floor-b: #d6dbe0;
    --wall-hi: #808c9a;
    --wall: #5d6875;
    --wall-lo: #414a55;
    --goal: #f5a800;
    --accent: #f5a800;
    --accent-ink: #141a20;
    --focus: #2a6fdb;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg1: #1b232b;
      --bg2: #0c1014;
    --top: #0c1014;
      --panel: #1c242c;
      --line: #2e3a45;
      --ink: #eef2f5;
      --muted: #8b99a6;
      --floor-a: #2c353f;
      --floor-b: #262e37;
      --wall-hi: #6a7683;
      --wall: #4a5561;
      --wall-lo: #313a44;
      --goal: #ffb703;
      --accent: #ffb703;
      --focus: #6aa5ff;
    }
  }
  :root[data-theme="dark"] {
    --bg1: #1b232b;
    --bg2: #0c1014;
    --top: #0c1014;
    --panel: #1c242c;
    --line: #2e3a45;
    --ink: #eef2f5;
    --muted: #8b99a6;
    --floor-a: #2c353f;
    --floor-b: #262e37;
    --wall-hi: #6a7683;
    --wall: #4a5561;
    --wall-lo: #313a44;
    --goal: #ffb703;
    --accent: #ffb703;
    --focus: #6aa5ff;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  html { height: 100%; background-color: var(--top); scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    height: 100%;
    margin: 0;
    background-color: var(--top);
    background-image: radial-gradient(90% 50% at 50% 55%, var(--bg1), transparent 100%);
    color: var(--ink);
    font-family: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    overscroll-behavior: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    touch-action: manipulation;
  }

  header {
    padding: 12px 16px 6px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .brand { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .brand svg { width: 32px; height: 32px; flex: none; filter: drop-shadow(0 2px 3px rgba(0,0,0,.3)); }
  .brand h1 {
    margin: 0;
    font-family: "Barlow Condensed", "Arial Narrow", Impact, sans-serif;
    font-weight: 700;
    font-size: 26px;
    letter-spacing: .04em;
    line-height: 1;
  }
  .brand small { display: block; margin-top: 2px; font-size: 12px; color: var(--muted); font-weight: 500; }
  .stats { display: flex; gap: 6px; flex: none; }
  .pill {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 5px 8px;
    min-width: 50px;
    text-align: center;
    line-height: 1.1;
  }
  .ibtn { min-width: 38px !important; padding: 5px 6px !important; }
  #hintWrap { position: relative; }
  #hintNote {
    position: absolute; top: calc(100% + 10px); right: 0; display: none; z-index: 20; pointer-events: none;
    background: var(--panel); color: var(--ink);
    border: 1px solid var(--line); border-radius: 12px;
    padding: 7px 12px; white-space: nowrap; text-align: left;
    max-width: calc(100vw - 24px); width: max-content;
    font: 600 clamp(11px, 3.4vw, 13px)/1.25 "Barlow", system-ui, sans-serif;
    box-shadow: 0 6px 20px rgba(0,0,0,.3);
  }
  #hintNote::before {
    content: ""; position: absolute; top: -6px; right: 16px;
    width: 10px; height: 10px; background: var(--panel);
    border-left: 1px solid var(--line); border-top: 1px solid var(--line);
    transform: rotate(45deg);
  }
  #toast {
    position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%);
    display: none; z-index: 5; pointer-events: none;
    background: var(--panel); color: var(--ink);
    border: 1px solid var(--line); border-radius: 999px;
    padding: 8px 16px; font: 600 14px/1.2 "Barlow", system-ui, sans-serif;
    box-shadow: 0 6px 20px rgba(0,0,0,.3); max-width: 92%; text-align: center;
  }
  .pill span { display: block; font-size: 11px; color: var(--muted); font-weight: 500; }
  .pill b {
    font-family: "Barlow Condensed", "Arial Narrow", sans-serif;
    font-size: 22px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  .lvlbtn {
    margin-top: 3px;
    padding: 3px 10px 3px 10px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--ink);
    font: 600 12px/1.2 "Barlow", system-ui, sans-serif;
    cursor: pointer;
  }
  #lvl { white-space: nowrap; }

  #picker {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    padding: calc(env(safe-area-inset-top, 0px) + 12px) 10px calc(env(safe-area-inset-bottom, 0px) + 12px);
    background: rgba(8, 12, 16, .6);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    z-index: 10;
  }
  #picker.show { display: flex; }
  #picker .sheet {
    width: 100%;
    max-width: 560px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 14px 12px 12px;
    box-shadow: 0 20px 50px rgba(0,0,0,.4);
  }
  #picker .sheet header { padding: 0 4px 10px; }
  #picker h3 { margin: 0; font-family: "Barlow Condensed", "Arial Narrow", sans-serif; font-size: 22px; letter-spacing: .03em; }
  #picker .close {
    width: 34px; height: 34px; border-radius: 10px;
    border: 1px solid var(--line); background: transparent; color: var(--ink);
    font-size: 18px; cursor: pointer;
  }
  #levels {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 4px;
    position: relative;
    max-height: 62vh;
    overflow-y: auto;
    overscroll-behavior: contain;
    padding-bottom: 2px;
  }
  .credit { margin: 10px 4px 0; font-size: 11px; color: var(--muted); line-height: 1.35; }
  #levels button {
    aspect-ratio: 1;
    min-width: 0;
    padding: 0;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--bg1);
    color: var(--ink);
    font: 600 13px/1 "Barlow", system-ui, sans-serif;
    cursor: pointer;
    position: relative;
  }
  #levels button.current {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
    box-shadow: 0 2px 10px rgba(245,168,0,.35);
  }
  #levels button.done::after {
    content: "";
    position: absolute;
    right: 2px; top: 2px;
    width: 5px; height: 5px;
    border-radius: 50%;
    background: #33b56d;
  }

  #stage { position: relative; flex: 1; min-height: 0; padding: 0 12px; }
  canvas { display: block; touch-action: none; margin: 0 auto; }

  #win {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(8, 12, 16, .55);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
  }
  #win.show { display: flex; animation: fade .25s ease-out; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { #win.show { animation: none; } }
  #win .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 24px 28px 22px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,.4);
    max-width: 86%;
  }
  #win .badge {
    width: 52px; height: 52px; margin: 0 auto 10px;
    border-radius: 50%;
    background: linear-gradient(#4fd38a, #2a9d63);
    display: grid; place-items: center;
    box-shadow: 0 6px 16px rgba(42,157,99,.45);
  }
  #win .badge svg { width: 28px; height: 28px; stroke: #fff; }
  #win h2 { margin: 0 0 4px; font-family: "Barlow Condensed", "Arial Narrow", sans-serif; font-size: 30px; letter-spacing: .02em; }
  #win p { margin: 0 0 18px; color: var(--muted); font-size: 16px; }
  .primary {
    background: var(--accent);
    color: var(--accent-ink);
    border: 0;

  }

  }

  footer {

    align-items: center;
    justify-content: space-between;
    padding: 6px 16px 14px;
    gap: 12px;
  }

    height: 44px;
    padding: 0 16px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--ink);
    font: 600 15px/1 "Barlow", system-ui, sans-serif;
    cursor: pointer;
  }
  .actions button:disabled { opacity: .4; }
  svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .dpad {
    display: grid;
    grid-template-columns: repeat(3, 50px);
    grid-template-rows: repeat(2, 50px);
    gap: 6px;
  }
  .dpad button {
    border-radius: 14px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--ink);
    display: grid; place-items: center;
    cursor: pointer;
    touch-action: none;
  }
  .dpad button:active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .dpad .up { grid-column: 2; grid-row: 1; }
  .dpad .left { grid-column: 1; grid-row: 2; }
  .dpad .down { grid-column: 2; grid-row: 2; }
  .dpad .right { grid-column: 3; grid-row: 2; }
  button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
</style>

  // ---------- Ses efektleri (WebAudio, dosya yok) ----------
  var soundOn = false;
  try { soundOn = localStorage.getItem('depo-sound') === '1'; } catch (e) {}
  var actx = null;
  function ac() {
    if (!actx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      actx = new AC();
    }
    if (actx.state === 'suspended') actx.resume();
    return actx;
  }
  var audioUnlocked = false;
  function unlockAudio() {
    if (audioUnlocked) return;
    var c = ac(); if (!c) return;
    try {
      var b = c.createBuffer(1, 1, 22050), src = c.createBufferSource();
      src.buffer = b; src.connect(c.destination); src.start(0);
    } catch (e) {}
    if (c.state === 'running') { audioUnlocked = true; return; }
    if (c.resume) c.resume().then(function () { audioUnlocked = c.state === 'running'; }).catch(function () {});
  }
  ['pointerup', 'touchend', 'click', 'keydown'].forEach(function (ev) {
    document.addEventListener(ev, unlockAudio, true);
  });
  function beep(freq, dur, type, vol, delay) {
    if (!soundOn) return;
    var c = ac(); if (!c || c.state !== 'running') return;
    var t0 = c.currentTime + (delay || 0);
    var osc = c.createOscillator(), g = c.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.12, t0 + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g); g.connect(c.destination);
    osc.start(t0); osc.stop(t0 + dur + 0.02);
  }
  function sfxStep() { beep(220, 0.06, 'square', 0.05); }
  var noiseBuf = null;
  function noiseBuffer(c) {
    if (noiseBuf) return noiseBuf;
    var len = c.sampleRate * 1.2;
    noiseBuf = c.createBuffer(1, len, c.sampleRate);
    var d = noiseBuf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    return noiseBuf;
  }
  function sfxScrape(dur) {
    if (!soundOn) return;
    var c = ac(); if (!c || c.state !== 'running') return;
    dur = dur || 0.16;
    var t0 = c.currentTime;
    var src = c.createBufferSource();
    src.buffer = noiseBuffer(c);
    src.loop = true;
    src.playbackRate.value = 0.8 + Math.random() * 0.5;

    var band = c.createBiquadFilter();
    band.type = 'bandpass';
    band.Q.value = 1.1;
    band.frequency.setValueAtTime(700, t0);
    band.frequency.linearRampToValueAtTime(420, t0 + dur * 0.55);
    band.frequency.linearRampToValueAtTime(600, t0 + dur);

    var hp = c.createBiquadFilter();
    hp.type = 'highpass';
    hp.frequency.value = 180;

    var g = c.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.16, t0 + dur * 0.18);
    g.gain.setValueAtTime(0.16, t0 + dur * 0.7);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

    src.connect(band); band.connect(hp); hp.connect(g); g.connect(c.destination);
    src.start(t0); src.stop(t0 + dur + 0.02);
    beep(120, 0.05, 'sine', 0.05, 0);
  }
  function sfxPush() { sfxScrape(0.17); }
  function sfxBlocked() { beep(90, 0.09, 'square', 0.06); }
  function sfxDrop() { beep(660, 0.09, 'sine', 0.08); beep(880, 0.12, 'sine', 0.07, 0.06); }
  function sfxUndo() { beep(300, 0.05, 'triangle', 0.05); }
  function sfxWin() {
    [523, 659, 784, 1047].forEach(function (f, i) { beep(f, 0.16, 'sine', 0.09, i * 0.09); });
  }
  function setSound(on) {
    soundOn = on;
    try { localStorage.setItem('depo-sound', on ? '1' : '0'); } catch (e) {}
    var btn = document.getElementById('soundBtn');
    if (btn) btn.setAttribute('aria-pressed', on ? 'true' : 'false');
    var svg = document.getElementById('soundIcon');
    if (svg) svg.innerHTML = on
      ? '<path d="M4 9v6h4l5 5V4L8 9H4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 6a9 9 0 0 1 0 12"/>'
      : '<path d="M4 9v6h4l5 5V4L8 9H4z"/><line x1="17" y1="9" x2="22" y2="14"/><line x1="22" y1="9" x2="17" y2="14"/>';
  }

  var progress = {};
  try {
    var raw = localStorage.getItem('depo-progress-v4');
    if (raw) progress = JSON.parse(raw) || {};
  } catch (e) { progress = {}; }
  function saveProgress() {
    try { localStorage.setItem('depo-progress-v4', JSON.stringify(progress)); } catch (e) {}
  }

  var cur = 0, W = 0, H = 0;
  var walls, goals, floorMask, boxes, player, history, moves, solved;
  var facing = [0, 1];
  var pushT = -1e9;
  var vp, vb, pulses, winTimer = 0;
  var layout = { cell: 40, ox: 0, oy: 0, cw: 0, ch: 0, dpr: 1 };

  // ---------- Bölüm yönetimi ----------
  function loadLevel(i) {
    cur = i;
    clearTimeout(winTimer);
    cancelExec();
    hint = null; hintPlan = null; hintToken++; hideToast();
    updateHintBtn();
    var base = LEVELS[i];
    rotated = wantRotate(base);
    var rows = rotated ? rotateRows(base) : base;
    H = rows.length;
    W = Math.max.apply(null, rows.map(function (r) { return r.length; }));
    walls = []; goals = []; boxes = []; floorMask = [];
    for (var y = 0; y < H; y++) {
      walls.push([]); goals.push([]); floorMask.push([]);
      for (var x = 0; x < W; x++) {
        var ch = rows[y][x] || ' ';
        walls[y][x] = ch === '#';
        goals[y][x] = ch === '.' || ch === '*' || ch === '+';
        floorMask[y][x] = false;
        if (ch === '$' || ch === '*') boxes.push([x, y]);
        if (ch === '@' || ch === '+') player = [x, y];
      }
    }
    var stack = [[player[0], player[1]]];
    while (stack.length) {
      var p = stack.pop(), px = p[0], py = p[1];
      if (px < 0 || py < 0 || px >= W || py >= H) continue;
      if (walls[py][px] || floorMask[py][px]) continue;
      floorMask[py][px] = true;
      stack.push([px + 1, py], [px - 1, py], [px, py + 1], [px, py - 1]);
    }
    history = []; moves = 0; solved = false; facing = [0, 1]; interacted = false;
    vp = player.slice();
    vb = boxes.map(function (b) { return b.slice(); });
    pulses = boxes.map(function () { return -1e9; });
    elWin.classList.remove('show');
    updateHud();
    renderLevelButtons();
    resize();
  }

  function boxAt(x, y) {
    for (var i = 0; i < boxes.length; i++) if (boxes[i][0] === x && boxes[i][1] === y) return i;
    return -1;
  }

  var interacted = false;
  function move(dx, dy) {
    if (solved) return;
    facing = [dx, dy];
    var nx = player[0] + dx, ny = player[1] + dy;
    if (walls[ny][nx]) { sfxBlocked(); kick(); return; }
    var bi = boxAt(nx, ny);
    var snap = { p: player.slice(), b: boxes.map(function (b) { return b.slice(); }) };
    interacted = true;
    if (bi >= 0) {
      var bx = nx + dx, by = ny + dy;
      if (walls[by][bx] || boxAt(bx, by) >= 0) { sfxBlocked(); kick(); return; }
      boxes[bi] = [bx, by];
      pushT = performance.now();
      if (goals[by][bx]) { pulses[bi] = performance.now(); sfxDrop(); }
      else sfxPush();
    } else {
      sfxStep();
    }
    history.push(snap);
    player = [nx, ny];
    moves++;
    updateHud();
    kick();
    if (boxes.every(function (b) { return goals[b[1]][b[0]]; })) win();
  }

  function undo() {
    if (solved || !history.length) return;
    var s = history.pop();
    player = s.p; boxes = s.b; moves = Math.max(0, moves - 1);
    pulses = boxes.map(function () { return -1e9; });
    sfxUndo();
    updateHud(); kick();
  }

  function win() {
    solved = true;
    cancelExec();
    sfxWin();
    var best = progress[cur];
    var isBest = !best || moves < best;
    var hadBest = !!best;
    if (isBest) { progress[cur] = moves; saveProgress(); }
    var last = cur === LEVELS.length - 1;
    var lvlAtWin = cur;
    document.getElementById('winTitle').textContent = last ? 'Hepsini bitirdin!' : 'Bölüm tamam!';
    document.getElementById('winText').textContent =
      moves + ' hamlede bitirdin' + (isBest && hadBest ? ' — yeni rekor!' : '.');
    document.getElementById('nextBtn').textContent = last ? 'Baştan başla' : 'Sonraki bölüm';
    updateHud();
    renderLevelButtons();
    winTimer = setTimeout(function () {
      if (solved && cur === lvlAtWin) elWin.classList.add('show');
    }, 450);
  }

  function updateHud() {
    elMoves.textContent = moves;
    elBest.textContent = progress[cur] ? progress[cur] : '–';
    elLvl.textContent = 'Bölüm ' + (cur + 1) + ' / ' + LEVELS.length;
    undoBtn.disabled = !history.length || solved;
  }

  function renderLevelButtons() {
    elLevels.innerHTML = '';
    LEVELS.forEach(function (_, i) {
      var b = document.createElement('button');
      b.textContent = i + 1;
      b.setAttribute('aria-label', (i + 1) + '. bölüm');
      var cls = [];
      if (i === cur) cls.push('current');
      if (progress[i]) cls.push('done');
      b.className = cls.join(' ');
      b.addEventListener('click', function () { closePicker(); loadLevel(i); });
      elLevels.appendChild(b);
    });
  }

  // ---------- Çizim yardımcıları ----------
  function css(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }
  function colors() {
    return {
      floorA: css('--floor-a'), floorB: css('--floor-b'),
      wallHi: css('--wall-hi'), wall: css('--wall'), wallLo: css('--wall-lo'),
      goal: css('--goal')
    };
  }
  function rr(g, x, y, w, h, r) {
    g.beginPath();
    if (g.roundRect) g.roundRect(x, y, w, h, r); else g.rect(x, y, w, h);
  }
  function isWall(x, y) {
    return x >= 0 && y >= 0 && x < W && y < H && walls[y][x];
  }
  function frac(n) { return n - Math.floor(n); }

  function drawFloor(g, px, py, c, x, y, col) {
    g.fillStyle = ((x + y) & 1) ? col.floorA : col.floorB;
    g.fillRect(px, py, c + 0.5, c + 0.5);
    // hafif doku
    var h = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453;
    g.fillStyle = 'rgba(0,0,0,.05)';
    for (var k = 1; k <= 5; k++) {
      g.fillRect(px + frac(h * k * 1.37) * c, py + frac(h * k * 2.11) * c, c * 0.035, c * 0.035);
    }
    g.fillStyle = 'rgba(255,255,255,.05)';
    for (k = 6; k <= 9; k++) {
      g.fillRect(px + frac(h * k * 1.91) * c, py + frac(h * k * 0.73) * c, c * 0.03, c * 0.03);
    }
    // derz
    g.lineWidth = 1;
    g.strokeStyle = 'rgba(0,0,0,.18)';
    g.strokeRect(px + 0.5, py + 0.5, c - 1, c - 1);
    g.strokeStyle = 'rgba(255,255,255,.08)';
    g.beginPath();
    g.moveTo(px + 1.5, py + c - 1.5); g.lineTo(px + 1.5, py + 1.5); g.lineTo(px + c - 1.5, py + 1.5);
    g.stroke();
    // duvar gölgeleri
    var gr;
    if (isWall(x, y - 1)) {
      gr = g.createLinearGradient(0, py, 0, py + c * 0.42);
      gr.addColorStop(0, 'rgba(0,0,0,.42)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = gr; g.fillRect(px, py, c, c * 0.42);
    }
    if (isWall(x - 1, y)) {
      gr = g.createLinearGradient(px, 0, px + c * 0.36, 0);
      gr.addColorStop(0, 'rgba(0,0,0,.32)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = gr; g.fillRect(px, py, c * 0.36, c);
    }
  }

  function drawGoal(g, px, py, c, col) {
    var ins = c * 0.17, s = c - ins * 2;
    g.save();
    rr(g, px + ins, py + ins, s, s, c * 0.1); g.clip();
    g.fillStyle = 'rgba(245,168,0,.14)';
    g.fillRect(px, py, c, c);
    g.strokeStyle = 'rgba(245,168,0,.5)';
    g.lineWidth = c * 0.085;
    for (var k = -c; k < c * 2; k += c * 0.22) {
      g.beginPath(); g.moveTo(px + k, py + c); g.lineTo(px + k + c, py); g.stroke();
    }
    g.restore();
    g.save();
    g.shadowColor = 'rgba(255,183,3,.75)';
    g.shadowBlur = c * 0.2;
    g.strokeStyle = col.goal;
    g.lineWidth = Math.max(2, c * 0.05);
    rr(g, px + ins, py + ins, s, s, c * 0.1); g.stroke();
    g.restore();
  }

  function drawWall(g, px, py, c, x, y, col) {
    var gr = g.createLinearGradient(px, py, px + c, py + c);
    gr.addColorStop(0, col.wallHi); gr.addColorStop(0.55, col.wall); gr.addColorStop(1, col.wallLo);
    g.fillStyle = gr;
    g.fillRect(px, py, c + 0.5, c + 0.5);
    // kenar ışığı
    g.strokeStyle = 'rgba(255,255,255,.28)';
    g.lineWidth = Math.max(1, c * 0.025);
    g.beginPath();
    if (!isWall(x, y - 1)) { g.moveTo(px, py + 1); g.lineTo(px + c, py + 1); }
    if (!isWall(x - 1, y)) { g.moveTo(px + 1, py); g.lineTo(px + 1, py + c); }
    g.stroke();
    g.strokeStyle = 'rgba(0,0,0,.35)';
    g.beginPath();
    if (!isWall(x, y + 1)) { g.moveTo(px, py + c - 1); g.lineTo(px + c, py + c - 1); }
    if (!isWall(x + 1, y)) { g.moveTo(px + c - 1, py); g.lineTo(px + c - 1, py + c); }
    g.stroke();
    // panel
    var ins = c * 0.13;
    rr(g, px + ins, py + ins, c - ins * 2, c - ins * 2, c * 0.05);
    g.fillStyle = 'rgba(255,255,255,.05)'; g.fill();
    g.strokeStyle = 'rgba(0,0,0,.28)'; g.lineWidth = 1; g.stroke();
    // perçinler
    var r = c * 0.035, o = c * 0.22;
    [[o, o], [c - o, o], [o, c - o], [c - o, c - o]].forEach(function (p) {
      g.fillStyle = 'rgba(0,0,0,.35)';
      g.beginPath(); g.arc(px + p[0] + r * 0.3, py + p[1] + r * 0.4, r, 0, 6.2832); g.fill();
      g.fillStyle = 'rgba(255,255,255,.4)';
      g.beginPath(); g.arc(px + p[0], py + p[1], r, 0, 6.2832); g.fill();
    });
  }

  function buildBg() {
    var L = layout, c = L.cell, g = bgx;
    bg.width = canvas.width; bg.height = canvas.height;
    g.setTransform(L.dpr, 0, 0, L.dpr, 0, 0);
    g.clearRect(0, 0, L.cw, L.ch);
    var col = colors(), x, y;
    for (y = 0; y < H; y++) for (x = 0; x < W; x++) {
      if (floorMask[y][x]) {
        var px = L.ox + x * c, py = L.oy + y * c;
        drawFloor(g, px, py, c, x, y, col);
        if (goals[y][x]) drawGoal(g, px, py, c, col);
      }
    }
    for (y = 0; y < H; y++) for (x = 0; x < W; x++) {
      if (walls[y][x]) drawWall(g, L.ox + x * c, L.oy + y * c, c, x, y, col);
    }
  }

  function drawCrate(x, y, c, on, age) {
    var pad = c * 0.07, s = c - pad * 2, px = x + pad, py = y + pad, r = c * 0.07;
    var light = on ? '#74d8a0' : '#dfaa62';
    var mid = on ? '#3fae74' : '#bf8232';
    var dark = on ? '#1c6a45' : '#7a4f18';
    var i;
    ctx.save();
    if (on) { ctx.shadowColor = 'rgba(80,230,150,.6)'; ctx.shadowBlur = c * 0.32; }
    else { ctx.shadowColor = 'rgba(0,0,0,.55)'; ctx.shadowBlur = c * 0.17; ctx.shadowOffsetY = c * 0.07; }
    var gr = ctx.createLinearGradient(px, py, px, py + s);
    gr.addColorStop(0, light); gr.addColorStop(1, mid);
    ctx.fillStyle = gr; rr(ctx, px, py, s, s, r); ctx.fill();
    ctx.restore();

    ctx.save();
    rr(ctx, px, py, s, s, r); ctx.clip();
    ctx.strokeStyle = 'rgba(0,0,0,.12)'; ctx.lineWidth = 1;
    for (i = 1; i < 9; i++) {
      var yy = py + s * i / 9 + ((i * 7) % 3) * 0.6;
      ctx.beginPath(); ctx.moveTo(px, yy); ctx.lineTo(px + s, yy); ctx.stroke();
    }
    ctx.strokeStyle = dark; ctx.globalAlpha = 0.6; ctx.lineWidth = Math.max(1.5, c * 0.03);
    for (i = 1; i < 3; i++) {
      ctx.beginPath(); ctx.moveTo(px, py + s * i / 3); ctx.lineTo(px + s, py + s * i / 3); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.strokeStyle = 'rgba(0,0,0,.18)'; ctx.lineWidth = c * 0.13;
    ctx.beginPath(); ctx.moveTo(px + s * 0.1, py + s * 0.1 + c * 0.03); ctx.lineTo(px + s * 0.9, py + s * 0.9 + c * 0.03); ctx.stroke();
    ctx.strokeStyle = dark; ctx.lineWidth = c * 0.11;
    ctx.beginPath(); ctx.moveTo(px + s * 0.1, py + s * 0.1); ctx.lineTo(px + s * 0.9, py + s * 0.9); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,.2)'; ctx.lineWidth = Math.max(1, c * 0.02);
    ctx.beginPath(); ctx.moveTo(px + s * 0.1 + c * 0.04, py + s * 0.1 - c * 0.03); ctx.lineTo(px + s * 0.9 + c * 0.04, py + s * 0.9 - c * 0.03); ctx.stroke();
    ctx.restore();

    ctx.strokeStyle = dark; ctx.lineWidth = c * 0.09;
    rr(ctx, px + c * 0.045, py + c * 0.045, s - c * 0.09, s - c * 0.09, r * 0.6); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,.4)'; ctx.lineWidth = Math.max(1, c * 0.02);
    ctx.beginPath(); ctx.moveTo(px + r, py + 1); ctx.lineTo(px + s - r, py + 1); ctx.stroke();

    var bolt = on ? '#e2ffef' : '#f3deb6';
    var bo = c * 0.115;
    [[bo, bo], [s - bo, bo], [bo, s - bo], [s - bo, s - bo]].forEach(function (p) {
      ctx.fillStyle = 'rgba(0,0,0,.35)';
      ctx.beginPath(); ctx.arc(px + p[0] + 0.7, py + p[1] + 0.9, c * 0.03, 0, 6.2832); ctx.fill();
      ctx.fillStyle = bolt;
      ctx.beginPath(); ctx.arc(px + p[0], py + p[1], c * 0.03, 0, 6.2832); ctx.fill();
    });

    if (age >= 0 && age < 550) {
      var t = age / 550;
      ctx.strokeStyle = 'rgba(120,255,180,' + (0.8 * (1 - t)) + ')';
      ctx.lineWidth = c * 0.05;
      var e = c * (0.05 + 0.3 * t);
      rr(ctx, px - e, py - e, s + e * 2, s + e * 2, r + e); ctx.stroke();
    }
  }

  var PC = {
    skin: '#f0c095', skinD: '#d9a273', hair: '#3a2a1f',
    shirt: '#3b78d8', shirtD: '#2a58ad', vest: '#ff8a1f', vestD: '#e26f0a',
    pants: '#2f3b52', pantsD: '#232d40', boot: '#2a201a',
    hat: '#e5383b', hatD: '#a8242a'
  };

  function limb(x1, y1, x2, y2, w, col) {
    ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  }
  function dot(x, y, r, col) {
    ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill();
  }
  function hardHat(cx, hy, c, brimL, brimR) {
    var g = ctx.createLinearGradient(0, hy - c * 0.2, 0, hy);
    g.addColorStop(0, '#ff7b7e'); g.addColorStop(1, PC.hat);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(cx, hy, c * 0.175, Math.PI, 0); ctx.closePath(); ctx.fill();
    ctx.fillStyle = PC.hatD;
    rr(ctx, cx - brimL, hy - c * 0.02, brimL + brimR, c * 0.05, c * 0.025); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.55)';
    ctx.beginPath(); ctx.ellipse(cx - c * 0.06, hy - c * 0.12, c * 0.045, c * 0.02, -0.5, 0, 6.2832); ctx.fill();
  }

  function drawFront(cx, y0, c, back, push, ph) {
    var hipY = y0 - c * 0.28, tTop = y0 - c * 0.63, tH = c * 0.37, tW = c * 0.38;
    // bacaklar
    [-1, 1].forEach(function (s) {
      var lift = Math.max(0, s * ph) * c * 0.05;
      ctx.fillStyle = s < 0 ? PC.pants : PC.pantsD;
      rr(ctx, cx + s * c * 0.085 - c * 0.06, hipY, c * 0.12, c * 0.28 - lift, c * 0.04); ctx.fill();
      ctx.fillStyle = PC.boot;
      rr(ctx, cx + s * c * 0.085 - c * 0.075, y0 - c * 0.085 - lift, c * 0.15, c * 0.085, c * 0.035); ctx.fill();
    });
    // gövde
    var gr = ctx.createLinearGradient(cx - tW / 2, 0, cx + tW / 2, 0);
    gr.addColorStop(0, PC.shirt); gr.addColorStop(1, PC.shirtD);
    ctx.fillStyle = gr; rr(ctx, cx - tW / 2, tTop, tW, tH, c * 0.08); ctx.fill();
    // yelek
    ctx.fillStyle = PC.vest;
    rr(ctx, cx - tW / 2 + c * 0.02, tTop + c * 0.02, tW - c * 0.04, tH - c * 0.03, c * 0.06); ctx.fill();
    if (!back) { ctx.fillStyle = PC.shirtD; ctx.fillRect(cx - c * 0.022, tTop + c * 0.02, c * 0.044, tH - c * 0.03); }
    ctx.fillStyle = 'rgba(255,255,255,.75)';
    var sw = back ? tW - c * 0.08 : (tW - c * 0.08 - c * 0.044) / 2;
    if (back) ctx.fillRect(cx - sw / 2, tTop + c * 0.19, sw, c * 0.03);
    else { ctx.fillRect(cx - tW / 2 + c * 0.04, tTop + c * 0.19, sw, c * 0.03); ctx.fillRect(cx + c * 0.026, tTop + c * 0.19, sw, c * 0.03); }
    // kollar
    [-1, 1].forEach(function (s) {
      var sx = cx + s * (tW / 2 - c * 0.01), sy = tTop + c * 0.07, hx, hy;
      if (push) {
        hx = cx + s * c * 0.11; hy = back ? tTop - c * 0.02 : tTop + c * 0.24;
        if (back) { hx = cx + s * c * 0.12; }
      } else { hx = cx + s * (tW / 2 + c * 0.02); hy = tTop + c * 0.29 + s * ph * c * 0.02; }
      limb(sx, sy, hx, hy, c * 0.095, PC.shirt);
      dot(hx, hy, c * 0.05, PC.skin);
    });
    // kafa
    var hyc = tTop - c * 0.115;
    var hg = ctx.createRadialGradient(cx - c * 0.05, hyc - c * 0.05, c * 0.02, cx, hyc, c * 0.17);
    hg.addColorStop(0, '#ffdcb8'); hg.addColorStop(1, PC.skin);
    dot(cx, hyc, c * 0.155, back ? PC.hair : hg);
    if (!back) {
      dot(cx - c * 0.055, hyc + c * 0.005, c * 0.022, '#1a222b');
      dot(cx + c * 0.055, hyc + c * 0.005, c * 0.022, '#1a222b');
      ctx.strokeStyle = '#a5643f'; ctx.lineWidth = Math.max(1, c * 0.02); ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(cx, hyc + c * 0.045, c * 0.045, 0.25, Math.PI - 0.25); ctx.stroke();
      ctx.fillStyle = PC.hair;
      ctx.fillRect(cx - c * 0.155, hyc - c * 0.03, c * 0.03, c * 0.08);
      ctx.fillRect(cx + c * 0.125, hyc - c * 0.03, c * 0.03, c * 0.08);
    }
    hardHat(cx, hyc - c * 0.02, c, c * 0.2, c * 0.2);
  }

  function drawSide(cx, y0, c, left, push, ph) {
    var hipY = y0 - c * 0.28, tTop = y0 - c * 0.63, tH = c * 0.37;
    ctx.save();
    ctx.translate(cx, 0);
    if (left) ctx.scale(-1, 1);
    // uzak kol
    limb(0, tTop + c * 0.07, -ph * c * 0.1, tTop + c * 0.28, c * 0.09, PC.shirtD);
    dot(-ph * c * 0.1, tTop + c * 0.28, c * 0.048, PC.skinD);
    // bacaklar
    [[1, PC.pantsD], [-1, PC.pants]].forEach(function (l) {
      var sway = l[0] * ph * c * 0.1, lift = Math.max(0, -l[0] * ph) * c * 0.03;
      limb(0, hipY, sway, y0 - c * 0.05 - lift, c * 0.12, l[1]);
      ctx.fillStyle = PC.boot;
      rr(ctx, sway - c * 0.05, y0 - c * 0.085 - lift, c * 0.17, c * 0.085, c * 0.035); ctx.fill();

      if (pref === 'on' && !isFs() && now - lastAuto > 1500) { lastAuto = now; enter(); }
    }
    document.addEventListener('pointerup', auto, true);
    document.addEventListener('keydown', auto, true);
    document.addEventListener('fullscreenchange', sync);
    document.addEventListener('webkitfullscreenchange', sync);
  })();


  // ---------- Girdi: parmakla yol çiz, kaldırınca karakter yürür ----------
  var exec = { timer: 0, queue: [] };
  var preview = null;   // önizleme hücreleri
  var trail = [];       // parmakla geçilen karelerin izi
  function cancelExec() {
    clearInterval(exec.timer); exec.timer = 0; exec.queue = [];
    if (preview) { preview = null; kick(); }
  }
  function runQueue(q) {
    clearInterval(exec.timer); exec.timer = 0;
    exec.queue = q.slice();
    if (!exec.queue.length) return;
    function step() {
      var d = exec.queue.shift();
      if (d) move(d[0], d[1]);
      if (!exec.queue.length || solved) { clearInterval(exec.timer); exec.timer = 0; exec.queue = []; }
    }
    step();
    if (exec.queue.length) exec.timer = setInterval(step, 220);
  }

  // Parmak yeni karenin yaklaşık ortasına gelince karakter o kareye adım atar
  var drag = null;
  canvas.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    cancelExec();
    try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
    // Parmağı, karakterin karesinin ortasında kabul et (tahta birimi)
    drag = { id: e.pointerId, lx: e.clientX, ly: e.clientY, fx: player[0] + 0.5, fy: player[1] + 0.5 };
    kick();
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!drag || e.pointerId !== drag.id) return;
    var c = layout.cell || 40;
    var GAIN = 1.0; // 1.0: parmak ile karakter aynı hızda ilerler
    drag.fx += (e.clientX - drag.lx) / c * GAIN;
    drag.fy += (e.clientY - drag.ly) / c * GAIN;
    drag.lx = e.clientX; drag.ly = e.clientY;
    var guard = 0;
    while (guard++ < 6 && !solved) {
      var px0 = player[0], py0 = player[1];
      var offx = drag.fx - (px0 + 0.5), offy = drag.fy - (py0 + 0.5);
      var sx = Math.trunc(offx + (offx > 0 ? 0.4 : -0.4)), sy = Math.trunc(offy + (offy > 0 ? 0.4 : -0.4));
      if (!sx && !sy) break;
      var d;
      if (sx && (!sy || Math.abs(offx) >= Math.abs(offy))) d = [sx > 0 ? 1 : -1, 0];
      else d = [0, sy > 0 ? 1 : -1];
      move(d[0], d[1]);
      if (player[0] === px0 && player[1] === py0) {
        // Engel: parmağı hedef karenin ortasına varmadan tut, geri dönünce hemen tepki versin
        if (d[0]) drag.fx = px0 + 0.5 + d[0] * 0.55;
        else drag.fy = py0 + 0.5 + d[1] * 0.55;
        break;
      }
      if (d[0]) drag.fy = Math.min(player[1] + 1.2, Math.max(player[1] - 0.2, drag.fy));
      else drag.fx = Math.min(player[0] + 1.2, Math.max(player[0] - 0.2, drag.fx));
    }
    kick();
  });
  function endDrag(e) {
    if (drag && e.pointerId === drag.id) { drag = null; kick(); }
  }
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);
  canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  // Yön tuşları: bırakınca tek adım
  document.querySelectorAll('.dpad button').forEach(function (b) {
    var d = b.getAttribute('data-d').split(',').map(Number);
    b.addEventListener('click', function () { cancelExec(); move(d[0], d[1]); });
  });

  window.addEventListener('keydown', function (e) {
    var k = e.key.toLowerCase();
    var map = { arrowup: [0,-1], w: [0,-1], arrowdown: [0,1], s: [0,1], arrowleft: [-1,0], a: [-1,0], arrowright: [1,0], d: [1,0] };
    if (map[k]) { e.preventDefault(); move(map[k][0], map[k][1]); }
    else if (k === 'z' || k === 'u' || k === 'backspace') { e.preventDefault(); undo(); }
    else if (k === 'escape') { closePicker(); }
    else if (k === 'r') { loadLevel(cur); }
    else if (k === 'enter' && elWin.classList.contains('show')) { next(); }
  });

  function next() { loadLevel((cur + 1) % LEVELS.length); }
  document.getElementById('nextBtn').addEventListener('click', next);
  undoBtn.addEventListener('click', undo);
  document.getElementById('reset').addEventListener('click', function () { loadLevel(cur); });

  // Cihaz gerçekten döndürülünce bölümü yeniden yerleştir; tablet gezinme çubuğunun
  // açılıp kapanması, klavye açılması ya da ufak yeniden boyutlanmalar (hızlı dokunuşlarda
  // olabiliyor) burada SAYILMAZ — onlar sadece görünümü tazeler, bölümü sıfırlamaz.
  var portraitQuery = window.matchMedia && window.matchMedia('(orientation: portrait)');
  var lastPortrait = portraitQuery ? portraitQuery.matches : (window.innerHeight >= window.innerWidth);
  var relayoutRaf = 0;
  function relayout() {
    if (relayoutRaf) return;
    relayoutRaf = requestAnimationFrame(function () {
      relayoutRaf = 0;
      var nowPortrait = portraitQuery ? portraitQuery.matches : (window.innerHeight >= window.innerWidth);
      var flipped = nowPortrait !== lastPortrait;
      lastPortrait = nowPortrait;
      if (flipped && !interacted && wantRotate(LEVELS[cur]) !== rotated) loadLevel(cur);
      else resize();
    });
  }
  window.addEventListener('resize', relayout);
  window.addEventListener('orientationchange', relayout);
  if (window.matchMedia) {
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    if (mq.addEventListener) mq.addEventListener('change', rebuild);
  }
  new MutationObserver(rebuild).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  document.getElementById('soundBtn').addEventListener('click', function () {
    ac();
    setSound(!soundOn);
    if (!soundOn) return;
    setTimeout(function () { beep(523, 0.1, 'sine', 0.08); }, 150);
  });
  setSound(soundOn);

  var start = 0;
  while (start < LEVELS.length - 1 && progress[start]) start++;
  loadLevel(start);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(relayout);
})();
</script>
</body>
